# decomp.wtf on a server (or any computer with Docker): docker compose up -d, then
#   docker compose exec decomp decomp url     the address that opens it (signed in)
# For a team room at your own address, also publish the room port (decomp share <project> --address ...).
#
# The image builds from the repository root and bakes the fork's source in, so the app installs
# itself from the image on first start: no GitHub, no decomp.wtf/dl, no branch channel. An update
# is a rebuild + redeploy; bump DECOMP_INSTALL_ID to make the volume's install be redone.
#
# Behind a front door (Tailscale `serve`, a reverse proxy) the browser arrives with that name as
# its Host header, which the app refuses with 403 "bad host" unless the name is in
# DECOMP_ALLOWED_HOSTS. A comma- or space-separated list, e.g. "decomp.jaguar-duck.ts.net".
name: decomp-wtf
services:
  decomp:
    build:
      context: ${DECOMP_CHECKOUT:-.}        # repository root; override for a deployment elsewhere
      dockerfile: site/public/Dockerfile
    image: decomp-wtf:0.10.6-fork3
    container_name: decomp-wtf
    restart: unless-stopped
    init: true
    environment:
      DECOMP_PORT: "6464"
      DECOMP_INSTALL_ID: "20261016-fork3"   # bump it: the volume's install is redone from the image
      DECOMP_ALLOWED_HOSTS: "${DECOMP_ALLOWED_HOSTS:-}"
    ports:
      - "127.0.0.1:6464:6464"
    volumes:
      - decomp-wtf-home:/home/decomp
      - ${DECOMP_ROMS:-/home/bpstuder/roms}:/roms:ro   # games you own; import by path, e.g. /roms/game.gba
networks:
  default:
    ipam:
      config:
        # This host has consumed Docker's default pools (172.17-31/16 and many 192.168.x/20), so pin one.
        - subnet: 10.79.0.0/24
volumes:
  decomp-wtf-home:
