# decomp.wtf on a server (or any computer with Docker): docker compose up -d, then
#   docker compose exec decomp decomp url     the address that opens it (signed in)
# For a team room at your own address, also publish the room port (decomp share <project> --address ...).
#
# Fork (bpstuder/decomp.wtf): the app installs itself inside the container from this fork's `main` branch
# on GitHub, so both a restart's reinstall and `decomp update` follow the fork rather than the discontinued
# upstream. DECOMP_REPO is resolved by site/public/install.sh. Set DECOMP_SOURCE to a folder instead of
# branch:main to install from a mounted checkout while developing.
name: decomp-wtf
services:
  decomp:
    build: site/public
    container_name: decomp-wtf
    restart: unless-stopped
    init: true
    environment:
      DECOMP_PORT: "6464"
      DECOMP_SOURCE: branch:main     # branch:<name> on the fork, "release", or a folder path
      DECOMP_REPO: bpstuder/decomp.wtf
    ports:
      - "127.0.0.1:6464:6464"
    volumes:
      - decomp-wtf-home:/home/decomp
      - ${DECOMP_ROMS:-/home/bpstuder/roms}:/roms:ro   # games you own; import by path, e.g. /roms/game.gba
networks:
  default:
    ipam:
      config:
        # This host has consumed Docker's default pools (172.17-31/16 and many 192.168.x/20), so pin one.
        - subnet: 10.79.0.0/24
volumes:
  decomp-wtf-home:
